name: FilePath

on:
  push:
    paths:
      - 'Caprine.FilePath/**'
      - 'Caprine.FilePath.Tests/**'
      - 'global.json'
      - '.github/workflows/filepath.yml'
  pull_request:
    paths:
      - 'Caprine.FilePath/**'
      - 'Caprine.FilePath.Tests/**'
      - 'global.json'
      - '.github/workflows/filepath.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - run: dotnet test Caprine.FilePath.Tests/Caprine.FilePath.Tests.csproj --configuration Release --nologo -warnaserror
      - run: dotnet pack Caprine.FilePath/Caprine.FilePath.csproj --configuration Release --no-build --nologo
